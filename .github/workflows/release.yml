name: Build & Release APK

# Đẩy tag dạng v1.0.1 lên GitHub là tự build APK và tạo Release.
# App trên điện thoại sẽ đọc Release mới nhất này để cập nhật OTA.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Giải mã keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret KEYSTORE_BASE64. APK phải ký cùng 1 khóa thì OTA mới cài đè được. Xem README.md mục 'Tạo khóa ký'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tính phiên bản
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "TAG_NAME=" >> "$GITHUB_ENV"
          fi

      - name: Build APK release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PghOwner="${{ github.repository_owner }}" \
            -PghRepo="${{ github.event.repository.name }}" \
            -PappVersion="$APP_VERSION" \
            -PappCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "FloatingClock-${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FloatingClock-${{ env.APP_VERSION }}
          path: FloatingClock-${{ env.APP_VERSION }}.apk

      - name: Tạo GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FloatingClock-${{ env.APP_VERSION }}.apk
          generate_release_notes: true
