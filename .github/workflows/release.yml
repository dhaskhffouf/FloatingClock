name: Build & Release APK

# Cứ git push lên main (hoặc chạy tay) là tự build APK và tạo Release mới cho OTA.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Giải mã keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret KEYSTORE_BASE64. APK phải ký cùng 1 khóa thì OTA mới cài đè được."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tính phiên bản tự động
        run: |
          APP_VER="1.0.${{ github.run_number }}"
          echo "APP_VERSION=$APP_VER" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$APP_VER" >> "$GITHUB_ENV"

      - name: Build APK release
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -PghOwner="${{ github.repository_owner }}" \
            -PghRepo="${{ github.event.repository.name }}" \
            -PappVersion="${{ env.APP_VERSION }}" \
            -PappCode="${{ github.run_number }}"

          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Không tìm thấy $APK_SRC. Kiểm tra lại cấu hình signingConfigs release."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$APK_SRC" "FloatingClock-${{ env.APP_VERSION }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FloatingClock-${{ env.APP_VERSION }}
          path: FloatingClock-${{ env.APP_VERSION }}.apk

      - name: Tạo GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Đồng Hồ Nổi ${{ env.TAG_NAME }}
          files: FloatingClock-${{ env.APP_VERSION }}.apk
          generate_release_notes: true